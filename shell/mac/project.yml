name: Farol
options:
  bundleIdPrefix: com.biud
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  FarolKit:
    path: Packages/FarolKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # as duas mudam juntas a cada release: a Sparkle ordena os updates pelo build
    # (CFBundleVersion), e o appcast-mac.sh recusa build que nao sobe
    MARKETING_VERSION: 3.0.0
    CURRENT_PROJECT_VERSION: 3.0.0
  configs:
    Release:
      ARCHS: arm64 x86_64
      ONLY_ACTIVE_ARCH: NO
targets:
  Farol:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Farol
        excludes:
          - Info.plist
          - Farol.entitlements
          - Node.entitlements
    dependencies:
      - package: FarolKit
        product: FarolApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biud.farol
        PRODUCT_NAME: Farol
        INFOPLIST_FILE: Farol/Info.plist
        CODE_SIGN_ENTITLEMENTS: Farol/Farol.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Farol:
    build:
      targets:
        Farol: all

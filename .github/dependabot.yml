version: 2
updates:
  # O projeto tem uma dependência só (Electron, invariante 1). Cadência mensal
  # porque bump de Electron exige abrir o app nos três sistemas antes de mergear.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
